<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GRADING SYSTEM</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
	table,th,tr,td {
		border: 1px solid black;
	}
	img {
		border-radius: 20px;
		width: 300px;
		height: 100px;
	}
	
</style>


</head>
<body>
	<div class="container mt-5">
	<div>
		<h1 class="text-center" style="color: red;">Analyze your grade</h1>
		<details>
			<summary>Instructions and info.</summary>
			<p>Enter your grades (Filipino, English, Math)</p>
			<table>
			<tr>
				<th style="color: white; background-color:dimgrey;">Numerical Grade</th>
				<th style="color: white; background-color:dimgrey;">Non-Numerical Rating</th></tr>
			<tr>
    			<td>94 to 100</td>
    			<td>Excellent</td>
			<tr>
    			<td>87 to 93.99</td>
    			<td>Above Satisfactory</td>
			<tr>
    			<td>80 to 86.99</td>
    			<td>Satisfactory</td>
			<tr>
    			<td>75 to 79.99</td>
    			<td>Needs Improvement</td>
			<tr>
    			<td>70 to 74.99</td>
    			<td>Poor</td>    			    			    			    		
			</table>
			</details><br>
		
	</div>
	<form id="Grade">
      <div class="row text-center">
        <div class="col-md-4 mb-4">
          <img src="https://raketcontent.com/1/Cream_Lined_Notebook_A4_b6933881bc.png" class="img-fluid mb-2">
          <input type="number" class="form-control border border-danger" id="eng" placeholder="English Grade" min="0" max="100" required>
        </div>
        <div class="col-md-4 mb-4">
          <img src="https://raketcontent.com/1/Blue_White_Simple_Filipino_Notebook_Cover_a275b1ec46.png" class="img-fluid mb-2">
          <input type="number" class="form-control border border-danger" id="fil" placeholder="Filipino Grade" min="0" max="100" required>
        </div>
        <div class="col-md-4 mb-4">
          <img src="https://ecdn.teacherspayteachers.com/cdn-cgi/image/format=avif,quality=70,width=525,height=525,onerror=redirect/thumbitem/Spiral-Notebook-Clip-Art-32-pieces-Math-Science-SS-and-Blank-3172401-1686058307/750f-3172401-2.jpg" class="img-fluid mb-2">
          <input type="number" class="form-control border border-danger" id="math" placeholder="Math Grade" min="0" max="100" required>
        </div>
      </div>

      <div class="text-center">
        <button type="button" class="btn btn-outline-danger" onclick="get()">Get Your Grade Average and Rating</button><kbd id="answer"> Waiting..</kbd>
      </div>
    </form>
		
	</form>

	
</div>

</body>

<script>
	function get() {
		var english = document.getElementById("eng").value;
		var filipino = document.getElementById("fil").value;
		var math = document.getElementById("math").value;
		var sum = Number(english) + Number(filipino) + Number(math)
		var avg = (sum / 3).toFixed(2)
		document.getElementById("answer").innerHTML = avg
	}
</script>
</html>
